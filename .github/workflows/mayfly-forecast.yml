name: Au Sable Mayfly Forecast Checks

on:
  pull_request:
    paths:
      - 'data/approved-hex-events.js'
      - 'lib/lake-hatch-review.js'
      - 'api/lake-hatch-events.js'
      - 'scripts/lake-hatch-review.test.mjs'
      - '.github/ISSUE_TEMPLATE/lake-mayfly-swarm.yml'
      - 'lib/lake-hex-observations.js'
      - 'api/lake-hex-observations.js'
      - 'scripts/lake-hex-observations.test.mjs'
      - 'lib/lake-mayflies.js'
      - 'api/lake-mayflies.js'
      - 'public/great-lakes-mayflies.html'
      - 'scripts/lake-mayflies.test.mjs'
      - 'public/michigan-mayfly-hatches.html'
      - 'public/mayfly-experience.js'
      - 'public/mayfly-experience.css'
      - 'public/mayfly-identification.css'
      - 'public/mayfly-identification.js'
      - 'public/images/mayflies/**'
      - 'scripts/mayfly-identification.test.mjs'
      - 'scripts/mayfly-experience.test.mjs'
      - 'scripts/michigan-mayflies.test.mjs'
      - 'lib/mayfly-forecast.js'
      - 'lib/mayfly-outlook.js'
      - 'api/mayfly-hatches.js'
      - 'scripts/mayfly-forecast.test.mjs'
      - 'scripts/mayfly-page.test.mjs'
      - 'public/mayfly-hatches.html'
      - '.github/workflows/mayfly-forecast.yml'
  push:
    branches:
      - 'feat/ausable-mayfly-hatch-predictor'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check data/approved-hex-events.js
          node --check lib/lake-hatch-review.js
          node --check api/lake-hatch-events.js
          node --check scripts/lake-hatch-review.test.mjs
          node --check lib/lake-hex-observations.js
          node --check api/lake-hex-observations.js
          node --check scripts/lake-hex-observations.test.mjs
          node --check lib/lake-mayflies.js
          node --check api/lake-mayflies.js
          node --check scripts/lake-mayflies.test.mjs
          node --check scripts/michigan-mayflies.test.mjs
          node --check public/mayfly-experience.js
          node --check public/mayfly-identification.js
          node --check scripts/mayfly-identification.test.mjs
          node --check scripts/mayfly-experience.test.mjs
          node --check lib/mayfly-forecast.js
          node --check lib/mayfly-outlook.js
          node --check api/mayfly-hatches.js
          node --check scripts/mayfly-forecast.test.mjs
      - name: Test no-fake-hatch and modern USGS contracts
        run: node --test scripts/mayfly-forecast.test.mjs scripts/mayfly-page.test.mjs scripts/lake-mayflies.test.mjs scripts/lake-hex-observations.test.mjs scripts/lake-hatch-review.test.mjs scripts/michigan-mayflies.test.mjs scripts/mayfly-experience.test.mjs scripts/mayfly-identification.test.mjs
